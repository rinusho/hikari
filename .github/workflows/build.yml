name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    permissions:
      contents: write # needed to attach the APK to a release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hikari.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/hikari.jks" >> "$GITHUB_ENV"

      - name: Unit tests and release build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "hikari-${GITHUB_SHA::7}.apk"
          echo "APK_NAME=hikari-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"

      # archive: false uploads the file as-is (no zip); the artifact is named after the file
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_NAME }}
          archive: false
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
